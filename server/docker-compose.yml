services:
  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  mongodb_data:
  postgres_data:
